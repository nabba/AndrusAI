services:
  # Docker socket proxy — limits API access to only what's needed for sandbox
  # See https://github.com/Tecnativa/docker-socket-proxy
  # Digest-pinned (2026-06-07) to the validated 0.2 image — supply-chain
  # hardening per substrate_radar's "@sha256 required" policy. A newer 0.4.x
  # exists, but bumping needs a CONTAINERS/IMAGES/POST/INFO/EXEC flag-behaviour
  # re-verify first (this proxy is the docker-escape security boundary).
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.2@sha256:083bd0ed8783e366d745f332f0e4489816dd35d984bef8f16e6d89484a22c082
    restart: unless-stopped
    privileged: true
    environment:
      CONTAINERS: 1        # Allow create/start/stop containers
      IMAGES: 1            # Allow pulling ollama/ollama image for fleet
      NETWORKS: 0
      VOLUMES: 0           # H5: Disabled — prevents host filesystem escape via volume creation
      INFO: 1              # 2026-04-25: enable /info so the LLM registry scanner can read
                           # the HOST's total RAM (vs the container's cgroup limit) when
                           # auto-detecting safe-to-pull model sizes. Read-only endpoint.
      POST: 1              # Allow POST (create/run)
      AUTH: 0
      SECRETS: 0
      SWARM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    tmpfs:
      - /run

  # ── Opt-in Docker create-body filter (security review 2026-06-06, finding S2) ─
  # Chain: gateway → docker-broker → docker-proxy → /var/run/docker.sock.
  # docker-proxy gates which API *paths* are reachable but cannot inspect request
  # *bodies*, so POST /containers/create can carry an arbitrary HostConfig
  # (Binds:["/:/host"], Privileged, PidMode:host, …) and escape to the host. This
  # broker validates that one body against app.docker_broker.policy and forwards
  # everything else unchanged. It holds NO docker socket and is unprivileged → a
  # bug fails CLOSED (gateway can't reach Docker), never opens a new escape.
  #
  # INERT by default: starts only under `--profile docker-broker`, and the
  # gateway keeps using docker-proxy until you set
  # GATEWAY_DOCKER_HOST=tcp://docker-broker:2375. See docs/DOCKER_BROKER.md.
  docker-broker:
    build: .
    profiles: ["docker-broker"]
    restart: unless-stopped
    command: ["python", "-m", "app.docker_broker"]
    environment:
      DOCKER_BROKER_UPSTREAM: http://docker-proxy:2375
      DOCKER_BROKER_LISTEN: 0.0.0.0:2375
      # DOCKER_BROKER_IMAGE_ALLOWLIST: botarmy-evolver,ollama/ollama  # default
    depends_on:
      - docker-proxy
    networks:
      - internal

  gateway:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - '127.0.0.1:${GATEWAY_PORT}:${GATEWAY_PORT}'
    environment:
      # Serving/compute split (2026-06-07): run all idle jobs EXCEPT the
      # worker-eligible set (idle_scheduler._WORKER_ELIGIBLE_JOBS), which run in
      # the `worker` service. Frees the gateway event loop from the multi-minute
      # GIL-holding cognition jobs. "all" (unset) = single-process (legacy).
      IDLE_SCHEDULER_ROLE: gateway
      # Default unchanged (docker-proxy). Set GATEWAY_DOCKER_HOST=tcp://docker-broker:2375
      # (+ `--profile docker-broker`) to route container-create through the body filter.
      # NB: a DEDICATED var, not DOCKER_HOST, to avoid colliding with the operator's
      # shell DOCKER_HOST. See docs/DOCKER_BROKER.md.
      DOCKER_HOST: ${GATEWAY_DOCKER_HOST:-tcp://docker-proxy:2375}
      # litellm logs WARNING noise at import when botocore is absent (we don't
      # route to Bedrock/SageMaker, so its AWS stream-shape preload always fails).
      # ERROR silences that; genuine litellm errors still surface.
      LITELLM_LOG: ERROR
      # Redirect CrewAI's SQLite long-term memory into the writable workspace
      # volume so it persists across restarts and survives read_only rootfs.
      CREWAI_STORAGE_DIR: /app/workspace/crewai_storage
      # Firecrawl self-hosted instance (via shared Docker network)
      FIRECRAWL_API_URL: http://firecrawl-api:3002
      # Composio SaaS integrations
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY}
      # Smithery MCP server registry (for auto-discovery of remote MCP servers)
      SMITHERY_API_KEY: ${SMITHERY_API_KEY:-}
      # ── Paid B2B / LinkedIn data adapters (optional) ──────────────────
      # When set, the research_orchestrator's source_priority chain
      # automatically includes the matching adapter:
      #
      #   APOLLO_API_KEY     → unlocks the `apollo` adapter (Apollo.io REST).
      #                        Provides head_of_sales name + title +
      #                        LinkedIn URL + (tier-dependent) work email.
      #                        ~$59/mo basic plan. Get key at
      #                        https://apollo.io/settings/api.
      #   PROXYCURL_API_KEY  → unlocks the `linkedin_data` adapter.
      #                        Provides personal LinkedIn URLs without
      #                        scraping. ~$0.01-$0.03 per lookup. Get key
      #                        at https://nubela.co/proxycurl.
      #
      # Without these keys the adapters degrade silently to free fallbacks
      # (Brave structural search) — partial coverage but no crash.
      # Restart `docker compose up -d gateway` after changing .env.
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      PROXYCURL_API_KEY: ${PROXYCURL_API_KEY:-}
      # ── Capability Recovery Loop ───────────────────────────────────
      # When the final answer looks like "I cannot…", the system tries
      # alternative routes (re_route → other crew, escalate_tier →
      # premium model, sandbox_execute → run extracted code, direct_tool
      # → bypass LLM, skill_chain → invoke matching skill) before
      # delivering. Off by default; flip to true once verified.
      # See app/recovery/ for design.
      RECOVERY_LOOP_ENABLED: ${RECOVERY_LOOP_ENABLED:-false}
      RECOVERY_DETECTION_THRESHOLD: ${RECOVERY_DETECTION_THRESHOLD:-0.80}
      RECOVERY_MAX_ATTEMPTS: ${RECOVERY_MAX_ATTEMPTS:-2}
      RECOVERY_BUDGET_SECONDS: ${RECOVERY_BUDGET_SECONDS:-90}
      # Host RAM in GB — used by app/llm_registry_scanner to compute the
      # safe-to-pull model size cap. On Docker-Desktop-for-Mac the
      # container's view of /proc/meminfo and Docker /info both return
      # the VM's slice (e.g. 23.4 GB for a 48 GB host), which would
      # mis-budget Ollama (Ollama runs on the host, not inside the VM).
      # Run `python3 scripts/sync_host_capacity.py` to auto-detect and
      # write these into .env (idempotent, runs once at install too).
      HOST_TOTAL_RAM_GB: ${HOST_TOTAL_RAM_GB:-}
      HOST_OS_BASELINE_GB: ${HOST_OS_BASELINE_GB:-}
      # Git safe.directory for workspace backup (volume has different ownership)
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /app/workspace
      # DB backup split (2026-05-16, Option C). The gateway only runs
      # the chromadb step; pg + neo4j are handled by the host launchd
      # LaunchAgent installed via scripts/install_db_backup.sh. The
      # docker-proxy doesn't expose /exec/.../start (no EXEC: 1 flag),
      # so attempting pg_dump/neo4j-admin from inside the gateway
      # returns 403. See app/healing/db_backup.py docstring.
      DB_BACKUP_HOST_MANAGED: ${DB_BACKUP_HOST_MANAGED:-1}
      # Verified mutation engine — image the gateway spawns (via docker-proxy)
      # for each self-improvement run. See Dockerfile.evolver +
      # app/self_improvement/evolver_spawn.py. Built under the `evolver` profile.
      EVOLVER_IMAGE: ${EVOLVER_IMAGE:-botarmy-evolver:latest}
    volumes:
      - ./workspace:/app/workspace
      - ./wiki:/app/wiki
      # Signal socket mount disabled — forwarder.py runs on host and bridges via HTTP
      # - ${SIGNAL_SOCKET_PATH}:${SIGNAL_SOCKET_PATH}
      - ${SIGNAL_ATTACHMENT_PATH:-/dev/null}:/app/attachments:ro
      # Service-account credentials (read-only). Mounted as a directory
      # so multiple credential files (GEE, future GCP services) can
      # share the same path without per-secret bind lines. Files inside
      # are gitignored — see .gitignore "secrets/" rule.
      - ./secrets:/app/secrets:ro
      # Firebase service-account mount retired — observability migrated to
      # Postgres (observability_snapshots) + /api/cp/* endpoints.
      # Set FIREBASE_ENABLED=1 and restore this line to re-enable Firestore.
    depends_on:
      # chromadb service removed 2026-05-17 — orphaned legacy container.
      # The gateway uses chromadb as an embedded library (PersistentClient
      # on workspace/<kb>/), never via HTTP. The standalone container had
      # been bind-mounting the workspace memory dir since the f240d54e
      # migration moved gateway code off chromadb.HttpClient, which
      # silently introduced a dual-writer SQLite corruption bug that
      # wiped the `memory/` KB twice (2026-04-25, 2026-05-17). See
      # docs/CHROMADB_INTEGRITY.md and PROGRAM §54.
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    networks:
      - external
      - internal
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8g
        reservations:
          cpus: '2.0'
          memory: 4g
    # read_only removed — needed for code self-modification (auto_deployer).
    # Security still enforced by: no-new-privileges, non-root user, sandbox isolation,
    # AST validation of deployed code, blocked dangerous imports, user approval gate.
    tmpfs:
      - /tmp
      - /run
      - /home/appuser/.local:uid=1000,gid=1000
      - /home/appuser/.cache:uid=1000,gid=1000
      - /home/appuser/.mem0:uid=1000,gid=1000

  # ── Idle-compute worker (serving/compute split, 2026-06-01) ─────────
  # Runs the idle scheduler's heavy jobs in a SEPARATE process so they don't
  # starve the gateway's asyncio event loop / /health. DEFAULT-OFF via the
  # `worker` profile — start with:
  #   docker compose --profile worker up -d worker
  # Shares the workspace bind-mount + DBs + docker-proxy with the gateway, but
  # MUST NOT open ChromaDB (single-writer; app/memory/chromadb_manager fail-
  # closed-guards every client open when IDLE_SCHEDULER_ROLE=worker). Only runs
  # jobs in idle_scheduler._WORKER_ELIGIBLE_JOBS (empty until migration fills
  # it per-job). Same image as the gateway; CMD overridden to the idle worker.
  worker:
    build: .
    restart: unless-stopped
    profiles: ["worker"]
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      IDLE_SCHEDULER_ROLE: worker
      # Default unchanged (docker-proxy). Set GATEWAY_DOCKER_HOST=tcp://docker-broker:2375
      # (+ `--profile docker-broker`) to route container-create through the body filter.
      # NB: a DEDICATED var, not DOCKER_HOST, to avoid colliding with the operator's
      # shell DOCKER_HOST. See docs/DOCKER_BROKER.md.
      DOCKER_HOST: ${GATEWAY_DOCKER_HOST:-tcp://docker-proxy:2375}
      LITELLM_LOG: ERROR
      CREWAI_STORAGE_DIR: /app/workspace/crewai_storage
      FIRECRAWL_API_URL: http://firecrawl-api:3002
      EVOLVER_IMAGE: ${EVOLVER_IMAGE:-botarmy-evolver:latest}
      HOST_TOTAL_RAM_GB: ${HOST_TOTAL_RAM_GB:-}
      HOST_OS_BASELINE_GB: ${HOST_OS_BASELINE_GB:-}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /app/workspace
    volumes:
      - ./workspace:/app/workspace
      - ./wiki:/app/wiki
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    networks:
      - external
      - internal
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    tmpfs:
      - /tmp
      - /run
      - /home/appuser/.local:uid=1000,gid=1000
      - /home/appuser/.cache:uid=1000,gid=1000
      - /home/appuser/.mem0:uid=1000,gid=1000
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 6g

  # ── Verified mutation engine — ephemeral sandbox image (2026-05-27) ──
  # Built but NOT run as a long-lived service. The gateway spawns throwaway
  # containers from this image via docker-proxy for each self-improvement run
  # (see app/self_improvement/evolver_spawn.py). The `evolver` profile keeps
  # `docker compose up` from starting it. Build once + on each deploy so its
  # baked HEAD matches the gateway:
  #   docker compose --profile evolver build evolver
  evolver:
    build:
      context: .
      dockerfile: Dockerfile.evolver
    image: ${EVOLVER_IMAGE:-botarmy-evolver:latest}
    profiles: ["evolver"]
    restart: "no"

  # ── chromadb service removed 2026-05-17 ─────────────────────────
  # The chromadb HTTP server container was an orphaned legacy artifact
  # from before commit f240d54e ("Fix 7 modules using broken
  # chromadb.HttpClient → get_client()"), which migrated the gateway
  # off the HTTP API and onto embedded chromadb.PersistentClient.
  #
  # The container kept bind-mounting the workspace memory directory
  # into the same path the gateway's PersistentClient also writes to.
  # Two processes (chromadb 0.5.23 in the container + chromadb 1.5.9
  # embedded in the gateway) writing to the same SQLite file caused
  # two `memory.corrupt_*` quarantine events (2026-04-25 + 2026-05-17).
  # Different chromadb versions have different schemas, which made the
  # corruption acute rather than just race-prone.
  #
  # Removing the service eliminates the dual-writer at the source.
  # The codebase already explicitly bans `chromadb.HttpClient(` in
  # production code (pinned by tests/test_subsystem_wiring.py:385).
  # See docs/CHROMADB_INTEGRITY.md for the protection layers that
  # replace whatever role this container was nominally serving.
  #
  # If you ever need the HTTP server back (e.g. for an external
  # consumer), restore this block via `git revert` AND change the
  # volume to a named volume — never bind-mount the workspace memory
  # directory again while the gateway also reads/writes that path.

  # ── Mem0 persistent memory infrastructure ───────────────────────
  # pgvector for vector storage, Neo4j for entity relationship graph.
  # Both internal-only (no internet, no host ports).
  postgres:
    # The default tag matches the live stack baseline. Operators can
    # override via env var (used by deploy/scripts/version-upgrade-drill.sh
    # to drill the forward-version-migration path against a newer image
    # without touching the live stack baseline).
    # Digest-pinned (2026-06-07) to pg18 / 18.4 + pgvector 0.8.2 — migrated from
    # pg16 the same day via deploy/POSTGRES_PG18_MIGRATION.md (logical dump/restore;
    # vectors preserved, no re-embed). The PGDATA env above keeps the legacy
    # /var/lib/postgresql/data mount working on pg18 (docker-library/postgres#1259).
    # Re-pin when substrate_radar flags a newer digest.
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg18@sha256:42e7f6b4e1eceb02ff14e3e6bc6108bbe259abbe83879dc1845d0da1ddeb555d}
    restart: unless-stopped
    shm_size: '1gb'
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - effective_cache_size=2GB
      - -c
      - max_connections=100
    environment:
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: ${MEM0_POSTGRES_PASSWORD:?MEM0_POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: mem0
      # Pin PGDATA to the legacy path. The postgres:18+ image moved its default
      # data dir to /var/lib/postgresql/<major>/ and refuses a bind mount at
      # /var/lib/postgresql/data (docker-library/postgres#1259). Setting PGDATA
      # explicitly keeps the existing ./workspace/mem0_pgdata mount working across
      # the pg16->18 bump (we migrate via logical dump/restore, not pg_upgrade
      # --link, so the new layout buys nothing). Harmless no-op on pg16.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./workspace/mem0_pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem0 -d mem0"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Grace for a fresh initdb on the macOS bind mount (e.g. first boot after a
      # major-version migration) so early-init probe failures don't flap the
      # container to "unhealthy" before the DB is actually up.
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'

  neo4j:
    # Override-able via NEO4J_IMAGE (see postgres comment above).
    # Digest-pinned (2026-06-07) to the running 5.26.25-community (the 5.26 LTS
    # line, supported to Nov 2028). Driver 6.2 <-> server 5.26 is a supported
    # pairing. Re-pin when substrate_radar flags a newer digest.
    image: ${NEO4J_IMAGE:-neo4j:5-community@sha256:b357872da95a164c5243ca8d9060601130717ff43cee3c829402fab46209a412}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${MEM0_NEO4J_PASSWORD:?MEM0_NEO4J_PASSWORD must be set in .env}
      NEO4J_PLUGINS: '[]'
      NEO4J_server_memory_heap_initial__size: 1g
      NEO4J_server_memory_heap_max__size: 2g
      NEO4J_server_memory_pagecache_size: 1g
      NEO4J_dbms_jvm_additional: '-XX:+UseG1GC'
    volumes:
      - ./workspace/mem0_neo4j:/data
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The old 5s timeout was too tight to ride out transient neo4j HTTP
      # slowness (GC pauses under the 2g heap), so probes got killed and the
      # container flapped to "unhealthy" while functionally fine — which then
      # blocks `docker compose up -d gateway` via the depends_on health gate.
      # Wider Docker timeout + wget's own --timeout (so it fails cleanly rather
      # than being killed) + more start grace tolerate the blips; 127.0.0.1
      # also sidesteps any localhost->IPv6 resolution delay.
      test: ["CMD-SHELL", 'wget --no-verbose --tries=1 --timeout=10 --spider http://127.0.0.1:7474 || exit 1']
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g

  # ── Signal messaging infrastructure ──────────────────────────
  # Both signal-cli and forwarder run on the HOST via launchd:
  #   com.botarmy.signal-cli       — signal-cli daemon (--http 127.0.0.1:7583)
  #   com.botarmy.signal-forwarder — polls signal-cli, forwards to gateway
  # Docker networking causes WebSocket receive failures, so host is required.
  # Forwarder forwards to http://127.0.0.1:8765/signal/inbound (gateway port).

networks:
  external:
    driver: bridge
  internal:
    driver: bridge
    internal: true   # No internet access for ChromaDB or docker-proxy

volumes: {}
